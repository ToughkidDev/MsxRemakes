<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUE BRICK for MSX2 (fan port)</title>
<meta name="description" content="CUE BRICK for MSX2 — unofficial fan port.">
<meta property="og:title" content="CUE BRICK for MSX2 (fan port)">
<style>
@font-face { font-family: "Press Start 2P"; src: url(CueBrick4MSX/WWW/fonts/PressStart2P.woff2) format("woff2"); font-display: swap; }
:root {
  --bg: #0b0f2e; --ink: #ffffff; --acc: #17a868;
  --pixel: "Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  color: var(--ink); -webkit-font-smoothing: antialiased;
  background:
    linear-gradient(#ffffff09 1px, transparent 1px) 0 0 / 100% 8px,
    radial-gradient(1100px 760px at 50% 30%, #26308a 0%, #131a55 45%, #0b0f2e 100%) no-repeat,
    var(--bg);
}
h1 { font-family: var(--pixel); font-weight: 400; font-size: clamp(26px, 8.4vw, 84px); line-height: 1; letter-spacing: -1px; white-space: nowrap;
     text-shadow: 0.065em 0.065em 0 var(--acc); }
h1 a { color: inherit; text-decoration: none; }
h1 a:hover { color: #ffd21f; }
h1 a:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
</style>
</head>
<body>
  <h1><a href="https://github.com/ToughkidDev/MsxRemakes/tree/main/CueBrick4MSX/WWW">CUE BRICK</a></h1>
</body>
